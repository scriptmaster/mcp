<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Test the authenticated MCP OpenAI prompt endpoint">
  <title>OpenAI Prompt Test · MCP</title>
  <style>
    :root{color-scheme:dark;--bg:#070b18;--panel:#11182b;--line:#2a3658;--text:#eaf0ff;--muted:#aab6d2;--teal:#6ee7d8;--violet:#9d8cff;--bad:#ff9b9b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#202060 0,transparent 28rem),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(900px,92vw);margin:auto;padding:46px 0 80px}header,.panel{border:1px solid var(--line);border-radius:22px;background:#11182be8;box-shadow:0 24px 70px #0007}header{padding:30px;margin-bottom:18px}h1{margin:.15rem 0;font-size:clamp(2rem,6vw,3.6rem);letter-spacing:-.04em}.eyebrow{color:var(--teal);font-weight:800;letter-spacing:.13em;text-transform:uppercase}.muted,.meta{color:var(--muted)}.panel{padding:26px}label{display:block;margin:17px 0 7px;font-weight:750}input,textarea,button{width:100%;font:inherit;border-radius:11px}input,textarea{border:1px solid var(--line);background:#060a14;color:var(--text);padding:12px}textarea{min-height:190px;resize:vertical}button{margin-top:18px;padding:13px;border:0;background:linear-gradient(90deg,var(--teal),var(--violet));color:#07101f;font-weight:900;cursor:pointer}button:disabled{opacity:.55;cursor:wait}pre{min-height:120px;white-space:pre-wrap;overflow-wrap:anywhere;background:#040710;border:1px solid var(--line);padding:16px;border-radius:12px}.error{color:var(--bad)}a{color:#9ddcff}.row{display:grid;grid-template-columns:1fr 2fr;gap:14px}@media(max-width:650px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header>
    <div class="eyebrow">MCP · authenticated test client</div>
    <h1>OpenAI Prompt Test</h1>
    <p class="muted">Calls <code>POST /openai/prompt</code>. Credentials remain in this page's memory only and are not saved to browser storage.</p>
  </header>
  <section class="panel">
    <form id="prompt-form">
      <div class="row">
        <div><label for="api-key">X-API-Key</label><input id="api-key" name="api-key" value="DevSpectra" autocomplete="off" required></div>
        <div><label for="api-secret">X-API-Secret</label><input id="api-secret" name="api-secret" type="password" autocomplete="off" required></div>
      </div>
      <label for="prompt">Prompt</label>
      <textarea id="prompt" name="prompt" maxlength="16384" required>Reply with exactly: MCP OpenAI integration OK</textarea>
      <button id="send" type="submit">Send prompt</button>
    </form>
    <p id="status" class="meta" role="status">Ready.</p>
    <label for="response">Response</label>
    <pre id="response" tabindex="0">No response yet.</pre>
    <p><a href="/">← MCP operator manual</a></p>
  </section>
  <script src="/assets/openai-test.js" defer></script>
</main></body></html>
